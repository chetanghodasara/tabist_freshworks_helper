<html>
<head>
    <script src={{{appclient}}}></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@freshworks/crayons@v4/dist/crayons/crayons.esm.js"></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/@freshworks/crayons@v4/dist/crayons/crayons.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@freshworks/crayons@v4/css/crayons-min.css" />
<!--    <link rel="stylesheet" type="text/css" href="styles/style.css"/>-->
    <link rel="stylesheet" href="../styles/style.css" />
</head>
<body>
<!-- Modal Container -->

<div class="main">
    <div id="chatModal" class="modal">
        <div class="modal-content">
            <div class="chat-header">
                <h5><p id="conversationTitle"></p></h5>
<!--                <h5>Recent Conversation (last 50 messages)</h5>-->
            </div>
            <div id="chatContainer" class="chat-container">
                <!-- Chat messages will be dynamically appended here -->
            </div>
        </div>
    </div>
    <div id="sourcetextContainer">
        <p id="sourcetext"></p>
    </div>
    <button id="getSuggestionButton" class="top-left">Get Suggestion</button>
    <div id="apptextContainer">
        <p id="apptext"></p>
    </div>
</div>
<script src="../scripts/modal.js"></script>
</body>
</html>
